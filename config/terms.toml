# Terms tracked on Twitter. Queries are byte-identical to the bot tracker's config/sources.toml,
# so series keys line up with imported history. Precision, n and 95% interval come from the
# bot tracker's hand-checked sample (docs/research/precision-2026-11-16.json). A family term
# needs precision >= 0.70; context terms are shown but never in a family.

[probe]
# Always matches plenty of English posts; zero means Twitter is failing, not quiet.
query = "(thing OR any OR tell)"

[[term]]
id = "troon"
label = "troon(s)"
family = "anti-trans"
query = "(troon OR troons)"
source = 'GLAAD, Guide to Anti-LGBTQ Online Hate and Disinformation, entry "Troon"'
source_url = "https://glaad.org/smsi/anti-lgbtq-online-hate-speech-disinformation-guide/"
precision = 0.83
precision_n = 47
precision_ci = [0.699, 0.911]
added = "2026-11-17"

[[term]]
id = "no-such-thing-as-trans"
label = "no such thing as (a) trans"
family = "anti-trans"
query = '("no such thing as trans" OR "no such thing as a trans")'
source = "The 74, 14 Dec 2023"
source_url = "https://www.the74million.org/article/in-private-texts-ny-ed-council-reps-congressional-candidate-demean-lgbtq-kids/"
precision = 0.96
precision_n = 50
precision_ci = [0.865, 0.989]
