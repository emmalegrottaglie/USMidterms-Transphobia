label = "US midterm general election"
status = "confirmed"
source = "Federal Election Commission, 'Election results and voting information', https://www.fec.gov/introduction-campaign-finance/election-results-and-voting-information/ (checked 18 November 2026: 'Tuesday, November 3, 2026, is the next regularly scheduled federal General Election date.')"
