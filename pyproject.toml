[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antitrans-rhetoric-monitor"
version = "0.1.0"
description = "How often anti-trans terms appeared on Twitter around the 2026 US midterm elections."
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["monitor", "monitor.collectors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
